name: Hämta AISHELL-3-röster
on:
  workflow_dispatch:
    inputs:
      voices:
        description: "Antal manliga röster"
        default: "5"
      per:
        description: "Meningar per röst"
        default: "150"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Hämta röster
        env:
          N_VOICES: ${{ github.event.inputs.voices }}
          PER_SPEAKER: ${{ github.event.inputs.per }}
        run: python tools/fetch_aishell.py
      - name: Spara i repot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/aishell audio/aishell.json
          git diff --cached --quiet || git commit -m "AISHELL-3: utvalda manliga röster"
          git pull --rebase -q || true
          git push
