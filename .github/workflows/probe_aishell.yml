name: Undersök AISHELL-3
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          H=https://huggingface.co/datasets/AISHELL/AISHELL-3/resolve/main
          curl -sL $H/spk-info.txt -o spk.txt; curl -sL $H/train/content.txt -o train.txt; curl -sL $H/test/content.txt -o test.txt
          curl -sL "https://huggingface.co/api/datasets/AISHELL/AISHELL-3/tree/main/train/wav" | head -c 600; echo
          curl -sL "https://huggingface.co/api/datasets/AISHELL/AISHELL-3/tree/main/train/wav/SSB0073" | head -c 600; echo
          echo "== resultat"; python3 tools/probe_aishell.py
