name: Hämta ST-CMDS-meningar
on:
  workflow_dispatch:
    inputs:
      max:
        description: "Max antal meningar"
        default: "1500"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q pypinyin
      - name: Hämta meningar
        env:
          MAX_SENTENCES: ${{ github.event.inputs.max }}
        run: python tools/fetch_stcmds.py
      - name: Spara i repot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/stcmds audio/stcmds.json
          git diff --cached --quiet || git commit -m "ST-CMDS-meningar med native-ljud"
          git pull --rebase -q || true
          git push
