name: Hämta Tatoeba-ljud
on:
  workflow_dispatch:
    inputs:
      max:
        description: "Max antal meningar"
        default: "2000"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta meningar och ljud
        env:
          MAX_SENTENCES: ${{ github.event.inputs.max }}
        run: python tools/fetch_tatoeba.py
      - name: Spara i repot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio/tatoeba audio/tatoeba.json
          git diff --cached --quiet || git commit -m "Tatoeba-meningar med ljud"
          git push
